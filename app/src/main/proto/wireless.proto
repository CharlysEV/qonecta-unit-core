syntax = "proto2";

package com.andrerinas.openheadunit.proto;

option java_package = "com.andrerinas.openheadunit.proto";
option java_outer_classname = "WirelessProto";

enum MessageStatus {
    STATUS_UNSOLICITED_MESSAGE = 1;
    STATUS_SUCCESS = 0;
    STATUS_NO_COMPATIBLE_VERSION = -1;
    STATUS_WIFI_INACCESSIBLE_CHANNEL = -2;
    STATUS_WIFI_INCORRECT_CREDENTIALS = -3;
    STATUS_PROJECTION_ALREADY_STARTED = -4;
    STATUS_WIFI_DISABLED = -5;
    STATUS_WIFI_NOT_YET_STARTED = -6;
    STATUS_INVALID_HOST = -7;
    STATUS_NO_SUPPORTED_WIFI_CHANNELS = -8;
    STATUS_INSTRUCT_USER_TO_CHECK_THE_PHONE = -9;
    STATUS_PHONE_WIFI_DISABLED = -10;
    STATUS_WIFI_NETWORK_UNAVAILABLE = -11;
}

enum SecurityMode {
    UNKNOWN_SECURITY_MODE = 0;
    OPEN = 1;
    WEP_64 = 2;
    WEP_128 = 3;
    WPA_PERSONAL = 4;
    WPA2_PERSONAL = 8;
    WPA_WPA2_PERSONAL = 12;
    WPA_ENTERPRISE = 20;
    WPA2_ENTERPRISE = 24;
    WPA_WPA2_ENTERPRISE = 28;
}

enum AccessPointType {
    STATIC = 0;
    DYNAMIC = 1;
}

message WifiProjectionProtocolInfo {
    optional string ip_address = 1;
    optional int32 port = 2;
}

message AccessPointInfo {
    optional string ssid = 1;
    optional string key = 2;
    optional string bssid = 3;
    optional SecurityMode wifi_security_mode = 4;
    optional AccessPointType ap_type = 5;
    repeated int32 supported_wifi_channels = 6;
}

// Type 1: HU -> Phone (tell phone where to connect via TCP)
message WifiStartRequest {
    optional string ip_address = 1;
    optional int32 port = 2;
    optional MessageStatus status = 3;
    optional WifiProjectionProtocolInfo wpp_info = 4;
    optional AccessPointInfo access_point_info = 5;
}

// Type 2: Phone -> HU (phone requests Wi-Fi credentials)
message WifiInfoRequest {
}

// Type 3: HU -> Phone (HU sends Wi-Fi credentials)
message WifiInfoResponse {
    optional string ssid = 1;
    optional string key = 2;
    optional string bssid = 3;
    optional SecurityMode security_mode = 4;
    optional AccessPointType access_point_type = 5;
    repeated int32 supported_wifi_channels = 6;
    optional MessageStatus status = 7;
}

// Type 4: Bidirectional (version check)
message WifiVersionRequest {
    optional int32 major_version = 1;
    optional int32 minor_version = 2;
    repeated int32 supported_wifi_channels = 3;
    optional string phone_ip = 4;
    optional WifiProjectionProtocolInfo wpp_info = 6;
}

// Type 5: Bidirectional (version check response)
message WifiVersionResponse {
    optional int32 major_version = 1;
    optional int32 minor_version = 2;
    optional string device_serial = 3;
    optional MessageStatus status = 4;
    optional uint32 unknown_field_5 = 5;
}

// Type 6: Phone -> HU (connection status report)
message WifiConnectStatus {
    optional MessageStatus status = 1;
    optional string error_hint = 2;
}

// Type 7: Bidirectional (start response / ack)
message WifiStartResponse {
    optional string ip_address = 1;
    optional int32 port = 2;
    optional MessageStatus status = 3;
}

// Type 8: Bidirectional (keepalive ping)
message WifiPingRequest {
    optional int64 timestamp = 1;
}

// Type 9: Bidirectional (keepalive pong)
message WifiPingResponse {
    optional int64 timestamp = 1;
}
